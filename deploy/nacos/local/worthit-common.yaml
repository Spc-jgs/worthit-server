worthit:
  http:
    connect-timeout: 2s
    read-timeout: 5s
  runtime:
    probe-message: phase0-local

logging:
  level:
    root: INFO
    com.shaopc.worthit: INFO

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,metrics
