worthit:
  clients:
    tracking:
      connect-timeout: 2s
      read-timeout: 15s
    reminder:
      connect-timeout: 2s
      read-timeout: 15s
  data-export:
    max-concurrent: 2
    max-fragment-bytes: 8388608
    max-archive-bytes: 20971520
  account-cancellation:
    enabled: true
    check-interval: 30s
    lock-ttl: 25s
    batch-size: 20
    cleanup-batch-size: 100
    audit-retention: 90d
  security:
    same-token:
      rotation:
        enabled: true
        check-interval: 10s
        refresh-before: 5m
        lock-ttl: 30s
