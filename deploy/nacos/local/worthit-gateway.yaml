spring:
  cloud:
    gateway:
      routes:
        - id: worthit-auth-api
          uri: lb://worthit-auth
          predicates:
            - Path=/api/v1/auth/**
        - id: worthit-tracking-api
          uri: lb://worthit-tracking
          predicates:
            - Path=/api/v1/categories/**,/api/v1/items/**,/api/v1/wishes/**,/api/v1/subscriptions/**,/api/v1/dashboard,/api/v1/lifecycle/**
        - id: worthit-reminder-api
          uri: lb://worthit-reminder
          predicates:
            - Path=/api/v1/reminders/**
        - id: local-infra-auth-readiness
          uri: lb://worthit-auth
          predicates:
            - Path=/__infra/auth/readiness
          filters:
            - SetPath=/actuator/health/readiness
        - id: local-infra-reminder-ping
          uri: lb://worthit-reminder
          predicates:
            - Path=/__infra/reminder/ping
          filters:
            - SetPath=/internal/__infra/ping
        - id: local-infra-tracking-reminder-ping
          uri: lb://worthit-tracking
          predicates:
            - Path=/__infra/tracking/reminder/ping
          filters:
            - SetPath=/internal/__infra/reminder/ping
        - id: local-infra-tracking-config
          uri: lb://worthit-tracking
          predicates:
            - Path=/__infra/tracking/config
          filters:
            - SetPath=/internal/__infra/config

worthit:
  security:
    trusted-header-cleanup:
      enabled: true
